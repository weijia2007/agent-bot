name: Windows desktop build

on:
  push:
    branches: [main, 'codex/desktop-agent-supervision']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: engine/global.json
      - name: Build isolated engine
        working-directory: engine
        run: dotnet publish native/NexusRelay.csproj -c Release -r win-x64 --self-contained true -p:PublishAot=false -o publish --nologo
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Engine regression tests
        working-directory: engine
        run: dotnet test --project tests/NexusRelay.Tests/NexusRelay.Tests.csproj -c Release -p:RuntimeIdentifier=win-x64 -p:RuntimeIdentifiers=win-x64 --no-ansi
      - name: Typecheck and regression tests
        working-directory: desktop
        run: |
          npm run typecheck
          npm test
      - name: Package Windows app
        working-directory: desktop
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: AgentBot-Windows-x64
          path: desktop/release/win-unpacked/
          if-no-files-found: error
          retention-days: 14
