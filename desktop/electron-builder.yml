appId: com.agentbot.app
productName: Agent Bot
copyright: Copyright 2026 Agent Bot
directories:
  output: release
  buildResources: build
electronDist: node_modules/electron/dist
files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
  - package.json
extraResources:
  - from: ../engine/publish
    to: engine
    filter:
      - '**/*'
  - from: build/icon.ico
    to: icon.ico
  - from: ../README.md
    to: README.zh-CN.md
  - from: ../docs/桌面会话验收-0.2.md
    to: docs/桌面会话验收-0.2.md
  - from: ../docs/screenshots
    to: docs/screenshots
win:
  icon: build/icon.ico
  signAndEditExecutable: false
  target:
    - target: dir
      arch:
        - x64
  artifactName: AgentBot-${version}-${arch}.${ext}
asar: true
